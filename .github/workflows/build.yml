name: Build and release binary

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload built assets"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Tag to release when manually dispatched (example: v0.6.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-decode:
    name: Build decode-rust-gui Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python_arch: x64
            artifact_suffix: x86_64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build tape-decode core (single, for bundling)
        if: matrix.arch != 'x86_64'
        run: cargo build --release --target "${{ matrix.target }}" --bin tape-decode

      - name: Build tape-decode core (Windows x86-64 v1-v4, for bundling)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          build_level() {
            local level="$1"
            local rustflags=""
            case "$level" in
              v1) rustflags="-C target-feature=+sse2" ;;
              v2) rustflags="-C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2" ;;
              v3) rustflags="-C target-feature=+avx,+avx2" ;;
              v4) rustflags="-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl" ;;
            esac
            echo "::group::Build Windows ${level}"
            CARGO_TARGET_DIR="target-x86-64-${level}" RUSTFLAGS="$rustflags" \
              cargo build --release --target x86_64-pc-windows-msvc --bin tape-decode
            echo "::endgroup::"
          }
          for level in v1 v2 v3 v4; do
            build_level "$level"
          done

      - name: List built Windows core binaries (for bundling)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          ls -la target-x86-64-v*/x86_64-pc-windows-msvc/release/tape-decode.exe 2>/dev/null || true
          ls -la target/x86_64-pc-windows-msvc/release/tape-decode.exe 2>/dev/null || true

      - name: Test Rust core
        if: matrix.arch == 'x86_64'
        shell: bash
        run: cargo test --workspace --release

      - name: Smoke test raw tape-decode binary (Windows)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            # Prefer a level binary (lowest first) so it runs on any x86-64 host
            BIN=""
            for lvl in v1 v2 v3 v4; do
              p="target-x86-64-${lvl}/x86_64-pc-windows-msvc/release/tape-decode.exe"
              if [ -f "$p" ]; then BIN="$p"; break; fi
            done
            if [ -z "$BIN" ]; then BIN="target/x86_64-pc-windows-msvc/release/tape-decode.exe"; fi
            if [ ! -f "$BIN" ]; then
              echo "No tape-decode.exe found for smoke test"; ls -la target*/x86_64-pc-windows-msvc/release/ || true; exit 1
            fi
            echo "Smoking: $BIN"
            TAPE_DECODE_MICROARCH=x86-64-v1 "$BIN" list-profiles | tee /tmp/tape_decode_profiles.txt
            grep -q "PAL_VHS" /tmp/tape_decode_profiles.txt
          else
            BIN="target/aarch64-pc-windows-msvc/release/tape-decode.exe"
            if [ ! -f "$BIN" ]; then
              echo "No tape-decode.exe found for smoke test"; ls -la target/aarch64-pc-windows-msvc/release/ || true; exit 1
            fi
            echo "Smoking: $BIN"
            "$BIN" list-profiles | tee /tmp/tape_decode_profiles.txt
            grep -q "PAL_VHS" /tmp/tape_decode_profiles.txt
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install launcher packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements-launcher.txt

      - name: Build decode launcher (single)
        if: matrix.arch != 'x86_64'
        env:
          TAPE_DECODE_BIN: target/${{ matrix.target }}/release/tape-decode.exe
        run: python scripts/ci/build-windows-decode-bin.py

      - name: Build decode launcher (with microarch levels)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: python scripts/ci/build-windows-decode-bin.py

      - name: Self-test bundled launcher (PyQt6 + tape-decode binary)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & .\dist\decode-rust-gui.exe --selftest 2>&1
          $out | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "selftest exited $LASTEXITCODE" }
          if (-not ($out -match 'SELFTEST OK')) { throw "SELFTEST OK missing from output" }

      - name: Verify bundled Windows icon payload + embedded EXE icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          import os
          import pathlib
          import subprocess
          import sys
          from PyQt6.QtGui import QIcon
          from PyQt6.QtWidgets import QApplication

          exe = pathlib.Path("dist/decode-rust-gui.exe")
          if not exe.is_file():
              raise SystemExit(f"missing launcher executable: {exe}")

          toc = subprocess.check_output(
              [sys.executable, "-m", "PyInstaller.utils.cliutils.archive_viewer", "-l", "-b", str(exe)],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          toc_norm = toc.replace("/", "\\").lower()
          required_entries = [
              "pyqt6\\qt6\\plugins\\platforms\\qwindows.dll",
              "tape-decode-rust.ico",
              "decode-rust-gui.ico",
          ]
          missing = [entry for entry in required_entries if entry not in toc_norm]
          if missing:
              raise SystemExit(f"missing bundled icon/plugin entries: {missing}")

          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          app = QApplication([])
          icon = QIcon(str(exe))
          sizes = [(s.width(), s.height()) for s in icon.availableSizes()]
          if icon.isNull() or not sizes:
              raise SystemExit("QIcon(exe) failed to load embedded Windows icon resource")
          print("WINDOWS_ICON_OK", sizes[:8])
          app.quit()
          '@
          python -c $code

      - name: Package versioned Windows ZIP
        shell: pwsh
        run: |
          $Version = '${{ steps.version.outputs.version }}'
          $ExeName = "decode-rust-gui-windows_${Version}_${{ matrix.artifact_suffix }}.exe"
          $ZipName = "decode-rust-gui-windows_${Version}_${{ matrix.artifact_suffix }}.zip"
          if (-not (Test-Path "dist\decode-rust-gui.exe")) {
            Write-Error "decode-rust-gui.exe not produced"
            Get-ChildItem dist -ErrorAction SilentlyContinue
            exit 1
          }
          Move-Item -Path dist\decode-rust-gui.exe -Destination "dist\$ExeName" -Force
          Compress-Archive -Path @("dist\$ExeName") -DestinationPath $ZipName -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipName))
          try {
            if ($zip.Entries.Count -ne 1) {
              throw "Expected 1 entry in $ZipName, found $($zip.Entries.Count)"
            }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.Contains('/') -or $entry.FullName.Contains('\')) {
                throw "ZIP entry is nested; expected flat layout: $($entry.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: decode-rust-gui-windows-${{ matrix.arch }}
          path: decode-rust-gui-windows_*_${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  linux-decode:
    name: Linux decode-rust-gui AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            appimagetool: appimagetool-x86_64.AppImage
            appimage_arch: x86_64
            artifact_suffix: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimagetool: appimagetool-aarch64.AppImage
            appimage_arch: aarch64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build tape-decode core (single, for bundling)
        if: matrix.arch != 'x86_64'
        run: cargo build --release --target "${{ matrix.target }}" --bin tape-decode

      - name: Build tape-decode core (x86-64 v1-v4 levels, for bundling)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          build_level() {
            local level="$1"
            local rustflags=""
            case "$level" in
              v1) rustflags="-C target-feature=+sse2" ;;
              v2) rustflags="-C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2" ;;
              v3) rustflags="-C target-feature=+avx,+avx2" ;;
              v4) rustflags="-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl" ;;
            esac
            echo "::group::Build ${level}"
            CARGO_TARGET_DIR="target-x86-64-${level}" RUSTFLAGS="$rustflags" \
              cargo build --release --target "${{ matrix.target }}" --bin tape-decode
            echo "::endgroup::"
          }
          for level in v1 v2 v3 v4; do
            build_level "$level"
          done

      - name: Test Rust core
        run: cargo test --workspace --release

      - name: Smoke test raw tape-decode binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            BIN=""
            for lvl in v1 v2 v3 v4; do
              p="target-x86-64-${lvl}/x86_64-unknown-linux-gnu/release/tape-decode"
              if [ -f "$p" ]; then BIN="$p"; break; fi
            done
            if [ -z "$BIN" ]; then BIN="target/x86_64-unknown-linux-gnu/release/tape-decode"; fi
            if [ ! -f "$BIN" ]; then
              echo "No tape-decode binary found for smoke"; ls -la target*/x86_64-unknown-linux-gnu/release/ || true; exit 1
            fi
            echo "Smoking: $BIN"
            TAPE_DECODE_MICROARCH=x86-64-v1 "$BIN" list-profiles | tee /tmp/tape_decode_profiles.txt
            grep -q "PAL_VHS" /tmp/tape_decode_profiles.txt
          else
            BIN="target/aarch64-unknown-linux-gnu/release/tape-decode"
            if [ ! -f "$BIN" ]; then
              echo "No tape-decode binary found for smoke"; ls -la target/aarch64-unknown-linux-gnu/release/ || true; exit 1
            fi
            echo "Smoking: $BIN"
            "$BIN" list-profiles | tee /tmp/tape_decode_profiles.txt
            grep -q "PAL_VHS" /tmp/tape_decode_profiles.txt
          fi

      - name: Setup Python (for decode launcher)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system libraries needed for complete PyQt6 xcb + GL plugin collection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libglvnd0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon0 || true

      - name: Install launcher packaging dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller -r requirements-launcher.txt

      - name: Build launcher binary
        if: matrix.arch != 'x86_64'
        env:
          TAPE_DECODE_BIN: target/${{ matrix.target }}/release/tape-decode
        run: python3 scripts/ci/build-linux-decode-bin.py

      - name: Build launcher binary (with microarch levels)
        if: matrix.arch == 'x86_64'
        run: python3 scripts/ci/build-linux-decode-bin.py

      - name: Self-test bundled launcher (PyQt6 + tape-decode binary)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -uo pipefail
          set +e
          ./dist/decode-rust-gui --selftest > /tmp/decode-rust-gui_selftest.txt 2>&1
          _st=$?
          set -e
          echo "--- selftest output (exit $_st) ---"
          cat /tmp/decode-rust-gui_selftest.txt
          echo "--- end output ---"
          if [ "$_st" -ne 0 ]; then echo "::error::selftest exited $_st"; exit "$_st"; fi
          grep -q "SELFTEST OK" /tmp/decode-rust-gui_selftest.txt

      - name: Build AppDir and AppImage
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AppDir squashfs-root
          mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps \
            AppDir/resources/icon

          cp dist/decode-rust-gui AppDir/usr/bin/decode-rust-gui
          chmod +x AppDir/usr/bin/decode-rust-gui

          cp resources/appimage/decode-rust-gui.desktop AppDir/usr/share/applications/decode-rust-gui.desktop
          cp resources/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          cp resources/icon/tape-decode-rust-256.png AppDir/usr/share/icons/hicolor/256x256/apps/decode-rust-gui.png

          # Keep one canonical icon file and expose required aliases via symlink to avoid duplicate payload files.
          ln -sf usr/share/icons/hicolor/256x256/apps/decode-rust-gui.png AppDir/decode-rust-gui.png
          ln -sf decode-rust-gui.png AppDir/.DirIcon
          ln -sf ../../decode-rust-gui.png AppDir/resources/icon/tape-decode-rust-256.png
          ln -sf decode-rust-gui.png AppDir/tape-decode-rust-256.png

          ln -sf usr/share/applications/decode-rust-gui.desktop AppDir/decode-rust-gui.desktop

          APPIMAGE_TOOL="${{ matrix.appimagetool }}"
          APPIMAGE_NAME="decode-rust-gui-linux_${BUILD_VERSION}_${{ matrix.artifact_suffix }}.AppImage"

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/${APPIMAGE_TOOL}"
          chmod +x "${APPIMAGE_TOOL}"
          "./${APPIMAGE_TOOL}" --appimage-extract
          env -u SOURCE_DATE_EPOCH ARCH=${{ matrix.appimage_arch }} ./squashfs-root/AppRun AppDir "${APPIMAGE_NAME}"
          chmod +x "${APPIMAGE_NAME}"

          # Self-test the final AppImage: proves PyQt6 + Qt platform plugin +
          # the bundled tape-decode binary all work inside the shipped artifact.
          # Strict (no || true) so a broken bundle fails CI.
          set +e
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            TAPE_DECODE_MICROARCH=x86-64-v1 QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "./${APPIMAGE_NAME}" --selftest > /tmp/decode-rust-gui_selftest.txt 2>&1
          else
            QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "./${APPIMAGE_NAME}" --selftest > /tmp/decode-rust-gui_selftest.txt 2>&1
          fi
          _st=$?
          set -e
          cat /tmp/decode-rust-gui_selftest.txt
          if [ "$_st" -ne 0 ]; then echo "::error::AppImage selftest exited $_st"; exit "$_st"; fi
          grep -q "SELFTEST OK" /tmp/decode-rust-gui_selftest.txt

          ZIP_NAME="decode-rust-gui-linux_${BUILD_VERSION}_${{ matrix.artifact_suffix }}.zip"
          zip -j "${ZIP_NAME}" "${APPIMAGE_NAME}"
          test -f "${ZIP_NAME}"
          test "$(unzip -Z1 "${ZIP_NAME}" | wc -l)" -eq 1

      - name: Upload decode-rust-gui Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: decode-rust-gui-linux-${{ matrix.artifact_suffix }}
          path: |
            decode-rust-gui-linux_*_${{ matrix.artifact_suffix }}.zip
          if-no-files-found: warn

  macos-decode:
    name: macOS decode-rust-gui DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_suffix: x86_64
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build tape-decode core (single, for bundling)
        if: matrix.arch != 'x86_64'
        run: cargo build --release --target "${{ matrix.target }}" --bin tape-decode

      - name: Build tape-decode core (x86-64 v1-v4 levels, for bundling)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          build_level() {
            local level="$1"
            local rustflags=""
            case "$level" in
              v1) rustflags="-C target-feature=+sse2" ;;
              v2) rustflags="-C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2" ;;
              v3) rustflags="-C target-feature=+avx,+avx2" ;;
              v4) rustflags="-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl" ;;
            esac
            echo "::group::Build ${level}"
            CARGO_TARGET_DIR="target-x86-64-${level}" RUSTFLAGS="$rustflags" \
              cargo build --release --target "${{ matrix.target }}" --bin tape-decode
            echo "::endgroup::"
          }
          for level in v1 v2 v3 v4; do
            build_level "$level"
          done

      - name: Test Rust core
        run: cargo test --workspace --release

      - name: Smoke test raw tape-decode binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            BIN=""
            for lvl in v1 v2 v3 v4; do
              p="target-x86-64-${lvl}/x86_64-apple-darwin/release/tape-decode"
              if [ -f "$p" ]; then BIN="$p"; break; fi
            done
            if [ -z "$BIN" ]; then BIN="target/x86_64-apple-darwin/release/tape-decode"; fi
            if [ ! -f "$BIN" ]; then
              echo "No tape-decode binary found for smoke"; ls -la target*/x86_64-apple-darwin/release/ || true; exit 1
            fi
            echo "Smoking: $BIN"
            TAPE_DECODE_MICROARCH=x86-64-v1 "$BIN" list-profiles | tee /tmp/tape_decode_profiles.txt
            grep -q "PAL_VHS" /tmp/tape_decode_profiles.txt
          else
            BIN="target/aarch64-apple-darwin/release/tape-decode"
            if [ ! -f "$BIN" ]; then
              echo "No tape-decode binary found for smoke"; ls -la target/aarch64-apple-darwin/release/ || true; exit 1
            fi
            echo "Smoking: $BIN"
            "$BIN" list-profiles | tee /tmp/tape_decode_profiles.txt
            grep -q "PAL_VHS" /tmp/tape_decode_profiles.txt
          fi

      - name: Setup Python (for decode launcher)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install launcher packaging dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller -r requirements-launcher.txt

      - name: Build launcher binary
        if: matrix.arch != 'x86_64'
        env:
          TAPE_DECODE_BIN: target/${{ matrix.target }}/release/tape-decode
        run: python3 scripts/ci/build-macos-decode-bin.py

      - name: Build launcher binary (with microarch levels)
        if: matrix.arch == 'x86_64'
        run: python3 scripts/ci/build-macos-decode-bin.py

      - name: Ad-hoc sign app bundle
        run: codesign -s - --deep --force dist/decode-rust-gui.app

      - name: Self-test bundled launcher (PyQt6 + tape-decode binary)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -uo pipefail
          set +e
          dist/decode-rust-gui.app/Contents/MacOS/decode-rust-gui --selftest > /tmp/decode-rust-gui_selftest.txt 2>&1
          _st=$?
          set -e
          echo "--- selftest output (exit $_st) ---"
          cat /tmp/decode-rust-gui_selftest.txt
          echo "--- end output ---"
          if [ "$_st" -ne 0 ]; then echo "::error::selftest exited $_st"; exit "$_st"; fi
          grep -q "SELFTEST OK" /tmp/decode-rust-gui_selftest.txt

      - name: Package decode-rust-gui macOS DMG
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_NAME="decode-rust-gui-macos_${BUILD_VERSION}_${{ matrix.artifact_suffix }}.dmg"
          rm -rf build/dmg
          mkdir -p build/dmg
          cp -R dist/decode-rust-gui.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "decode-rust-gui" -srcfolder build/dmg -ov -format UDZO "$DMG_NAME"
          test -f "$DMG_NAME"

          # Strict smoke (force v1 on x86-64, none on arm). The selftest step
          # above already exercised PyQt6 from the .app; this re-verifies the
          # binary still runs after DMG assembly.
          set +e
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            TAPE_DECODE_MICROARCH=x86-64-v1 dist/decode-rust-gui.app/Contents/MacOS/decode-rust-gui list-profiles > /tmp/decode-rust-gui_profiles.txt 2>&1
          else
            dist/decode-rust-gui.app/Contents/MacOS/decode-rust-gui list-profiles > /tmp/decode-rust-gui_profiles.txt 2>&1
          fi
          _sm=$?
          set -e
          cat /tmp/decode-rust-gui_profiles.txt
          if [ "$_sm" -ne 0 ]; then echo "::error::DMG list-profiles exited $_sm"; exit "$_sm"; fi
          grep -q "PAL_VHS" /tmp/decode-rust-gui_profiles.txt

      - name: Upload decode-rust-gui macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: decode-rust-gui-macos-${{ matrix.artifact_suffix }}
          path: decode-rust-gui-macos_*_${{ matrix.artifact_suffix }}.dmg
          if-no-files-found: warn

  release:
    name: Create GitHub release
    needs: [windows-decode, linux-decode, macos-decode]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW="${{ github.event.inputs.release_tag }}"
            if [[ -z "$RAW" ]]; then
              echo "release_tag is required when create_release=true" >&2
              exit 1
            fi
            TAG="v${RAW#v}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine previous release tag
        id: previous
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match "v*" "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Using release notes range: ${PREVIOUS_TAG}..${RELEASE_TAG}"
          else
            echo "No previous release tag found before ${RELEASE_TAG}; generating notes from full history."
          fi
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous_tag }}
        run: |
          set -euo pipefail
          API_NOTES_FILE="$(mktemp)"
          if [ -n "$PREVIOUS_TAG" ]; then
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' > "$API_NOTES_FILE"
          else
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              --jq '.body' > "$API_NOTES_FILE"
          fi
          # Granular, commit-based changelog grouped by component (tbc-tools
          # style); preserves New Contributors from the API output.
          python3 scripts/release/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --tag "$RELEASE_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --api-notes-file "$API_NOTES_FILE" \
            --output release-notes.md
          echo "--- release notes ---"
          cat release-notes.md
          echo "--- end release notes ---"

      - name: Publish GitHub release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refreshing release notes."
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS="$(find artifacts -type f \( -name '*.zip' -o -name '*.dmg' \))"
          if [ -z "$ASSETS" ]; then
            echo "No release assets found under artifacts/" >&2
            exit 1
          fi
          echo "Uploading release assets:"
          printf '%s\n' $ASSETS
          gh release upload "$RELEASE_TAG" $ASSETS --repo "${{ github.repository }}" --clobber

      - name: Mark release as latest
        continue-on-error: true
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --latest
          echo "Marked $RELEASE_TAG as the latest release."
