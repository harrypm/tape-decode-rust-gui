name: "Build Windows decode launcher"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-decode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            python_arch: x64
            artifact_suffix: x86_64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
            artifact_suffix: arm64

    name: Build decode-rust-gui EXE (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      SETUPTOOLS_RUST_CARGO_PROFILE: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(bash scripts/ci/git-version.sh)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build tape-decode binary (single)
        if: matrix.arch != 'x86_64'
        run: cargo build --release --target "${{ matrix.target }}" --bin tape-decode

      - name: Build tape-decode binaries (x86-64 v1-v4)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          build_level() {
            local level="$1"
            local rustflags=""
            case "$level" in
              v1) rustflags="-C target-feature=+sse2" ;;
              v2) rustflags="-C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2" ;;
              v3) rustflags="-C target-feature=+avx,+avx2" ;;
              v4) rustflags="-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl" ;;
            esac
            echo "::group::Build ${level}"
            CARGO_TARGET_DIR="target-x86-64-${level}" RUSTFLAGS="$rustflags" \
              cargo build --release --target "${{ matrix.target }}" --bin tape-decode
            echo "::endgroup::"
          }
          for level in v1 v2 v3 v4; do
            build_level "$level"
          done

      - name: Install launcher packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements-launcher.txt

      - name: Build launcher EXE
        if: matrix.arch != 'x86_64'
        env:
          TAPE_DECODE_BIN: target/${{ matrix.target }}/release/tape-decode.exe
        run: python .\scripts\ci\build-windows-decode-bin.py

      - name: Build launcher EXE (with microarch levels)
        if: matrix.arch == 'x86_64'
        # TAPE_DECODE_BIN omitted; packaging script discovers target-x86-64-vN/...
        shell: pwsh
        run: python .\scripts\ci\build-windows-decode-bin.py

      - name: Self-test bundled launcher (PyQt6 + tape-decode binary)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & .\dist\decode-rust-gui.exe --selftest 2>&1
          $out | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "selftest exited $LASTEXITCODE" }
          if (-not ($out -match 'SELFTEST OK')) { throw "SELFTEST OK missing from output" }

      - name: Package versioned EXE ZIP
        shell: pwsh
        run: |
          $Version = '${{ steps.version.outputs.version }}'
          $ExeName = "decode-rust-gui-windows_${Version}_${{ matrix.artifact_suffix }}.exe"
          Move-Item -Path dist\decode-rust-gui.exe -Destination "dist\$ExeName" -Force
          $ZipName = "decode-rust-gui-windows_${Version}_${{ matrix.artifact_suffix }}.zip"
          Compress-Archive -Path @("dist\$ExeName") -DestinationPath $ZipName -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipName))
          try {
            if ($zip.Entries.Count -ne 1) {
              throw "Expected 1 entry in $ZipName, found $($zip.Entries.Count)"
            }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.Contains('/') -or $entry.FullName.Contains('\')) {
                throw "ZIP entry is nested; expected flat layout: $($entry.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip-${{ matrix.arch }}
          path: decode-rust-gui-windows_*_${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
