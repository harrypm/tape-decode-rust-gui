name: "Build Windows decode launcher"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-decode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            python_arch: x64
            artifact_suffix: x86_64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
            artifact_suffix: arm64

    name: Build decode-rust-gui EXE (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      SETUPTOOLS_RUST_CARGO_PROFILE: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(bash scripts/ci/git-version.sh)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build tape-decode binary (single)
        if: matrix.arch != 'x86_64'
        run: cargo build --release --target "${{ matrix.target }}" --bin tape-decode

      - name: Build tape-decode binaries (x86-64 v1-v4)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          build_level() {
            local level="$1"
            local rustflags=""
            case "$level" in
              v1) rustflags="-C target-feature=+sse2" ;;
              v2) rustflags="-C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2" ;;
              v3) rustflags="-C target-feature=+avx,+avx2" ;;
              v4) rustflags="-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl" ;;
            esac
            echo "::group::Build ${level}"
            CARGO_TARGET_DIR="target-x86-64-${level}" RUSTFLAGS="$rustflags" \
              cargo build --release --target "${{ matrix.target }}" --bin tape-decode
            echo "::endgroup::"
          }
          for level in v1 v2 v3 v4; do
            build_level "$level"
          done

      - name: Install launcher packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pefile -r requirements-launcher.txt

      - name: Build launcher EXE
        if: matrix.arch != 'x86_64'
        env:
          TAPE_DECODE_BIN: target/${{ matrix.target }}/release/tape-decode.exe
        run: python .\scripts\ci\build-windows-decode-bin.py

      - name: Build launcher EXE (with microarch levels)
        if: matrix.arch == 'x86_64'
        # TAPE_DECODE_BIN omitted; packaging script discovers target-x86-64-vN/...
        shell: pwsh
        run: python .\scripts\ci\build-windows-decode-bin.py

      - name: Self-test bundled launcher (PyQt6 + tape-decode binary)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & .\dist\decode-rust-gui.exe --selftest 2>&1
          $out | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "selftest exited $LASTEXITCODE" }
          if (-not ($out -match 'SELFTEST OK')) { throw "SELFTEST OK missing from output" }

      - name: Verify bundled Windows icon payload + embedded EXE icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          import os
          import pathlib
          import subprocess
          import sys
          import pefile
          from PyQt6.QtCore import QFileInfo
          from PyQt6.QtGui import QIcon
          from PyQt6.QtWidgets import QApplication, QFileIconProvider

          exe = pathlib.Path("dist/decode-rust-gui.exe")
          if not exe.is_file():
              raise SystemExit(f"missing launcher executable: {exe}")

          toc = subprocess.check_output(
              [sys.executable, "-m", "PyInstaller.utils.cliutils.archive_viewer", "-l", "-b", str(exe)],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          toc_norm = toc.replace("/", "\\").lower()
          required_entries = [
              "pyqt6\\qt6\\plugins\\platforms\\qwindows.dll",
              "tape-decode-rust.ico",
              "decode-rust-gui.ico",
          ]
          missing = [entry for entry in required_entries if entry not in toc_norm]
          if missing:
              raise SystemExit(f"missing bundled icon/plugin entries: {missing}")

          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          app = QApplication([])

          # QIcon(exe) does NOT read PE-embedded icons (Qt loads image files,
          # not PE resources). Use QFileIconProvider, which resolves the shell
          # icon for the executable = the embedded PE icon.
          embedded = QFileIconProvider().icon(QFileInfo(str(exe)))
          emb_sizes = [(s.width(), s.height()) for s in embedded.availableSizes()]
          if embedded.isNull() or not emb_sizes:
              raise SystemExit(f"QFileIconProvider failed to load embedded EXE icon (isNull={embedded.isNull()}, sizes={emb_sizes})")

          # Hard PE-resource check: the exe actually contains an icon group
          # resource (proves PyInstaller embedded our --icon, not a missing icon).
          RT_ICON = 3
          RT_GROUP_ICON = 14
          pe = pefile.PE(str(exe), fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_RESOURCE"]])
          res_ids = [e.id for e in getattr(pe, "DIRECTORY_ENTRY_RESOURCE", []).entries if e.id is not None]
          if RT_GROUP_ICON not in res_ids or RT_ICON not in res_ids:
              raise SystemExit(f"exe missing embedded icon resources: ids={res_ids}")

          # The bundled .ico fallback (used by the launcher runtime) is a valid, Qt-loadable icon.
          src_ico = pathlib.Path("resources/icon/tape-decode-rust.ico")
          fallback = QIcon(str(src_ico))
          fb_sizes = [(s.width(), s.height()) for s in fallback.availableSizes()]
          if fallback.isNull() or not fb_sizes:
              raise SystemExit(f"bundled .ico fallback failed to load (isNull={fallback.isNull()}, sizes={fb_sizes})")

          print("WINDOWS_ICON_OK embedded=", emb_sizes[:8], "pe_resources=", res_ids, "fallback=", fb_sizes[:8])
          app.quit()
          '@
          python -c $code

      - name: Package versioned EXE ZIP
        shell: pwsh
        run: |
          $Version = '${{ steps.version.outputs.version }}'
          $ExeName = "decode-rust-gui-windows_${Version}_${{ matrix.artifact_suffix }}.exe"
          Move-Item -Path dist\decode-rust-gui.exe -Destination "dist\$ExeName" -Force
          $ZipName = "decode-rust-gui-windows_${Version}_${{ matrix.artifact_suffix }}.zip"
          Compress-Archive -Path @("dist\$ExeName") -DestinationPath $ZipName -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipName))
          try {
            if ($zip.Entries.Count -ne 1) {
              throw "Expected 1 entry in $ZipName, found $($zip.Entries.Count)"
            }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.Contains('/') -or $entry.FullName.Contains('\')) {
                throw "ZIP entry is nested; expected flat layout: $($entry.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip-${{ matrix.arch }}
          path: decode-rust-gui-windows_*_${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
